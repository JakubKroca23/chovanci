# Chovanci on server-main (personal Traefik)
# Path: /home/ubuntu/personal/projects/chovanci
# Deploy: git pull && docker compose up -d --build
# Domain: https://chovanec.propoj.app
name: chovanci

services:
  chovanci:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MATCH_WS_URL: ${NEXT_PUBLIC_MATCH_WS_URL:-wss://chovanec.propoj.app/ws}
    container_name: chovanci
    restart: unless-stopped
    environment:
      PORT: "3000"
      MATCH_WS_PORT: "3001"
      MATCH_WS_PATH: "/ws"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "3000"
      - "3001"
    networks:
      - personal
    labels:
      - traefik.enable=true
      - traefik.docker.network=personal

      # Next.js web
      - traefik.http.services.chovanci-web.loadbalancer.server.port=3000
      - traefik.http.routers.chovanci-web.rule=Host(`chovanec.propoj.app`)
      - traefik.http.routers.chovanci-web.entrypoints=websecure
      - traefik.http.routers.chovanci-web.tls=true
      - traefik.http.routers.chovanci-web.tls.certresolver=letsencrypt
      - traefik.http.routers.chovanci-web.priority=10
      - traefik.http.routers.chovanci-web.service=chovanci-web

      - traefik.http.middlewares.chovanci-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.chovanci-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.chovanci-web-http.rule=Host(`chovanec.propoj.app`)
      - traefik.http.routers.chovanci-web-http.entrypoints=web
      - traefik.http.routers.chovanci-web-http.middlewares=chovanci-https-redirect
      - traefik.http.routers.chovanci-web-http.priority=10
      - traefik.http.routers.chovanci-web-http.service=chovanci-web

      # Match WebSocket Situace legacy + HS duel (higher priority)
      - traefik.http.services.chovanci-ws.loadbalancer.server.port=3001
      - traefik.http.routers.chovanci-ws.rule=Host(`chovanec.propoj.app`) && (PathPrefix(`/ws`) || PathPrefix(`/hs`))
      - traefik.http.routers.chovanci-ws.entrypoints=websecure
      - traefik.http.routers.chovanci-ws.tls=true
      - traefik.http.routers.chovanci-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.chovanci-ws.priority=100
      - traefik.http.routers.chovanci-ws.service=chovanci-ws

networks:
  personal:
    external: true
    name: personal
